# rdpconn configuration
# Copy or symlink this file to ~/.config/rdpconn.conf to customize per user.

UP_VPNS=("org-vpn")
DOWN_VPNS=("personal-vpn-1" "example-vpn")
SERVERS=(
    "Example LAN|192.168.1.66|*|*"
    "Example Test|test.example.com|*|*"
)

KWALLET="kdewallet"
KWALLET_FOLDER="RDP"
#RDP_SHARE="${HOME}/.local/rdp-share"

# X11/XWayland session: prefer xfreerdp3.
RDP_CLIENTS_X11=("xfreerdp3")

# Wayland session: prefer the native SDL client, then fall back to xfreerdp3.
RDP_CLIENTS_WAYLAND=("sdl-freerdp3" "xfreerdp3")

# X11/XWayland session: center + right monitors.
RDP_ARGS_X11=(
    "/network:lan"
    "/bpp:16"
    "/rfx"
    #"/gfx:h264:avc444"
    #"+gfx:progressive"
    #"/gdi:sw"
    "-aero"
    #"-wallpaper"
    "-themes"
    "-fonts"
    "-menu-anims"
    "-window-drag"
    "/multimon"
    "/monitors:0,1"
    "/f"
    "+clipboard"
    # "/sound"
    "+auto-reconnect"
)

# Wayland session: rightmost monitors (match X11 layout).
RDP_ARGS_WAYLAND=(
    "/network:lan"
    "/bpp:16"
    # "/rfx"
    "/gfx:avc420,progressive"
    # "/gfx:progressive"
    # "/gdi:sw" # SW Rendering
    "-aero"
    # "-wallpaper"
    "-themes"
    "-fonts"
    "-menu-anims"
    "-window-drag"
    "/multimon"
    "/monitors:3,5"
    "/f"
    "+clipboard"
    # "/sound"
    "+auto-reconnect"
)
